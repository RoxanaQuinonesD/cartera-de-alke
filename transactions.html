<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimientos | Alke Wallet</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="tx">
<main class="container py-5">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h5 mb-0">Historial de movimientos</h1>
    <div class="d-flex gap-2">
      <a href="menu.html" class="btn btn-outline-secondary btn-sm">← Volver</a>
      <button id="logout" class="btn btn-outline-secondary btn-sm">Salir</button>
    </div>
  </div>

  <!-- MENSAJE DINÁMICO -->
  <div id="txMsg" class="alert alert-info d-none mb-3">
    Historial actualizado correctamente.
  </div>

  <div class="row g-3">

    <!-- MOVIMIENTOS -->
    <div class="col-12 col-lg-7">
      <div class="card p-4 h-100">
        <h2 class="h6 mb-3">Transacciones recientes</h2>

        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Monto</th>
              </tr>
            </thead>
            <tbody id="txBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- CONTACTOS -->
    <div class="col-12 col-lg-5">

      <!-- AGREGAR CONTACTO -->
      <div class="card p-4 mb-3">
        <h2 class="h6 mb-3">Agregar contacto</h2>

        <form id="addContactForm">
          <div class="mb-3">
            <label for="contactName" class="form-label">Nombre</label>
            <input id="contactName" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="contactBank" class="form-label">Banco</label>
            <input id="contactBank" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="contactAccount" class="form-label">Cuenta</label>
            <input id="contactAccount" class="form-control" required>
          </div>

          <button class="btn btn-brand w-100" type="submit">
            Agregar contacto
          </button>
        </form>
      </div>

      <!-- LISTA CONTACTOS -->
      <div class="card p-4">
        <h2 class="h6 mb-3">Mis contactos</h2>
        <ul id="contactsUl" class="list-group">
         
        </ul>
      </div>

    </div>
  </div>

</main>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/app.js"></script>

<script>
  // Mensaje dinámico simple
  $(document).ready(function () {
    $("#txMsg").removeClass("d-none").hide().fadeIn(500);
  });
</script>

</body>
</html>

<!-- Ajuste historial transacciones -->
