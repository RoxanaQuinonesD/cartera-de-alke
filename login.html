<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Alke Wallet</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="login">
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card p-4">
        <h1 class="h4 text-center mb-3">Alke Wallet</h1>
        <p class="text-muted text-center">Ingreso a la billetera</p>

        <div class="alert alert-info small">
          <strong>Usuario:</strong> user@alkewallet.com<br>
          <strong>Clave:</strong> 1234
        </div>

        <div id="msg" class="alert d-none"></div>

        <form id="loginForm">
          <input id="email" type="email" class="form-control mb-3" placeholder="Correo" required>
          <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña" required>
          <button class="btn btn-brand w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
