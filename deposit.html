<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depósito | Alke Wallet</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="deposit">
<main class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h5 mb-0">Depósito</h1>
    <button id="logout" class="btn btn-outline-secondary btn-sm">Salir</button>
  </div>

  <div class="card p-4 mb-3">
    <p class="text-muted mb-1">Saldo actual</p>
    <div class="h4 mb-0" id="balance"></div>
  </div>

  <!-- MENSAJE DINÁMICO -->
  <div id="depositMsg" class="alert alert-success d-none">
    Depósito realizado con éxito.
  </div>

  <div class="card p-4">
    <form id="depositForm">
      <div class="mb-3">
        <label for="amount" class="form-label">Monto a depositar</label>
        <input id="amount" type="number" class="form-control" min="1" required>
      </div>

      <button class="btn btn-brand w-100" type="submit">Depositar</button>
    </form>
  </div>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/app.js"></script>

<script>
  // Mensaje dinámico UX
  $("#depositForm").on("submit", function () {
    $("#depositMsg").removeClass("d-none").hide().fadeIn(400);
  });
</script>

</body>
</html>
