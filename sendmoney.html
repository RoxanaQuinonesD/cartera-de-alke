<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar dinero | Alke Wallet</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="send">
<main class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h5 mb-0">Enviar dinero</h1>
    <div class="d-flex gap-2">
      <a href="menu.html" class="btn btn-outline-secondary btn-sm">← Volver</a>
      <button id="logout" class="btn btn-outline-secondary btn-sm">Salir</button>
    </div>
  </div>

  <div class="card p-4 mb-3">
    <p class="text-muted mb-1">Saldo actual</p>
    <div class="h4 mb-0" id="balance"></div>
  </div>

  <div class="card p-4">
    <form id="sendForm">
      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label for="contactSelect" class="form-label mb-0">Contacto</label>

          <!-- BOTÓN CREAR CONTACTO -->
          <a href="transactions.html" class="btn btn-outline-secondary btn-sm">
            + Crear contacto
          </a>
        </div>

        <select id="contactSelect" class="form-select mt-2" required></select>
        <small class="text-muted">Si no aparece el contacto, créalo con el botón “Crear contacto”.</small>
      </div>

      <div class="mb-3">
        <label for="amount" class="form-label">Monto (CLP)</label>
        <input id="amount" type="number" class="form-control" min="1" required>
      </div>

      <button class="btn btn-brand w-100" type="submit">Enviar</button>
    </form>
  </div>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
