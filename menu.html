<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú | Alke Wallet</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="menu">
<main class="container py-5">

  <h1 class="h5 mb-4">Bienvenido, <span id="userName"></span></h1>

  <div id="menuCards" class="row g-3" style="display:none;">
    <div class="col-12 col-md-4">
      <a href="deposit.html" class="card p-4 text-center menu-card">
        <strong>Depositar</strong>
      </a>
    </div>

    <div class="col-12 col-md-4">
      <a href="sendmoney.html" class="card p-4 text-center menu-card">
        <strong>Enviar dinero</strong>
      </a>
    </div>

    <div class="col-12 col-md-4">
      <a href="transactions.html" class="card p-4 text-center menu-card">
        <strong>Movimientos</strong>
      </a>
    </div>
  </div>

  <div class="mt-4">
    <button id="logout" class="btn btn-outline-secondary btn-sm">Salir</button>
  </div>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/app.js"></script>

<script>
  // Animación UX con jQuery
  $(document).ready(function () {
    $("#menuCards").fadeIn(800);

    $(".menu-card").hover(
      function () { $(this).addClass("shadow"); },
      function () { $(this).removeClass("shadow"); }
    );
  });
</script>

</body>
</html>
